name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements ]; then pip install -r requirements; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Ruff (lint)
        run: |
          ruff check scripts tests main.py engine model

      - name: Black (format check)
        run: |
          black --check scripts tests main.py engine model

      - name: Mypy (non-blocking)
        continue-on-error: true
        run: |
          mypy engine model

      - name: Pytest with coverage
        run: |
          pytest --cov=engine --cov=model --cov=tests --cov-report=term-missing --cov-fail-under=0
